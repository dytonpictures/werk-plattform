name: CI

on:
  pull_request:
  push:
    branches: [Canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, contracts and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify generated and formatted files
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal dashboard packaging)"
          jq empty api/openapi.json
          for file in dashboard/public/*.js dashboard/server.mjs; do
            node --check "$file"
          done
      - name: Vet
        run: go vet ./...
      - name: Ensure modules are tidy
        shell: bash
        run: |
          set -euo pipefail
          cp go.mod /tmp/werk-go.mod
          cp go.sum /tmp/werk-go.sum
          go mod tidy
          diff -u /tmp/werk-go.mod go.mod
          diff -u /tmp/werk-go.sum go.sum

  test:
    name: Unit and race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test with race detector
        run: go test -race -count=1 ./...

  build:
    name: Native build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build all commands
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/...

